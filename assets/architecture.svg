    <path d="M185 82H245"/>
    <path d="M435 82H495"/>
    <path d="M715 72H805"/>
    <path d="M245 282H465V98H495"/>
    <path d="M605 120V245"/>
    <path d="M715 98H765V282H805" stroke-dasharray="7 6"/>
  </g>
  <g fill="#161f2b" stroke="#34465d" stroke-width="1.5">
