<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="390" viewBox="0 0 1020 390" role="img" aria-labelledby="title desc">
  <title id="title">TenderMatch — conceptual architecture</title>
  <desc id="desc">A business user uses a browser workspace backed by a Node.js application. The application receives procurement data, stores application data, sends notifications, and optionally calls an AI provider.</desc>
