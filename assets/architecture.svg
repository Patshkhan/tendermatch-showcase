    <text x="605" y="78" fill="#7ee8c5">Node.js</text><text x="605" y="101">application</text>
    <text x="895" y="78">Application</text><text x="895" y="101">data</text>
    <text x="140" y="278">Procurement</text><text x="140" y="301">sources</text>
