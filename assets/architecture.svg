    <rect x="245" y="45" width="190" height="75" rx="12"/>
    <rect x="805" y="45" width="180" height="75" rx="12"/>
    <rect x="35" y="245" width="210" height="75" rx="12"/>
    <rect x="495" y="245" width="220" height="75" rx="12"/>
    <rect x="805" y="245" width="180" height="75" rx="12"/>
  </g>
  <rect x="495" y="45" width="220" height="75" rx="12" fill="#132b2a" stroke="#7ee8c5" stroke-width="1.5"/>
